# Configuration for the training pipeline

data:
  # Input: The final feature table created by build_features.py
  features_path: 'data/processed/features_master_table.parquet'
  # Target column for prediction
  target_column: 'occupancy_class_h1'
  # Timestamp column for time-series splitting
  timestamp_column: 'timestamp'

features:
  # List of all features to be used in the model.
  # This list should be the source of truth.
  # We will start with the temporal and POI features from your original baseline.
  # Add or remove features here as you experiment.
  temporal:
    - 'hour_sin'
    - 'hour_cos'
    - 'dayofweek_sin'
    - 'dayofweek_cos'
    - 'month_sin'
    - 'month_cos'
    - 'is_weekend'
    - 'is_public_holiday'
  
  poi:
    # Updated to match the new feature names generated by build_features.py
    - 'poi_education_count_100m'
    - 'poi_education_count_200m'
    - 'poi_education_count_500m'
    - 'poi_health_count_100m'
    - 'poi_health_count_200m'
    - 'poi_health_count_500m'
    - 'poi_transport_count_100m'
    - 'poi_transport_count_200m'
    - 'poi_transport_count_500m'
    - 'poi_sustenance_count_100m'
    - 'poi_sustenance_count_200m'
    - 'poi_sustenance_count_500m'
    - 'poi_shop_count_100m'
    - 'poi_shop_count_200m'
    - 'poi_shop_count_500m'

  # Add other feature groups as you integrate them
  # weather:
  #   - 'temp_c'
  #   - 'precip_mm'
  
  # lag:
  #   - 'actual_state_lag_1h'

  # A special feature to drop - this is good practice to prevent target leakage
  potential_leakage:
    - 'VALOR' # This looked like a potential leak, excluding it.
    - 'geometry'
    - 'geometry_parsed'

  temporal_lags:
    - 'occ_prev_1h'
    - 'occ_roll3_mean'
    - 'occ_roll6_mean'

  weather_deltas:
    - 'weather_tm_delta_1h'

model:
  # Directory to save trained models and outputs
  output_dir: 'models/baseline'
  plots_dir: 'reports/figures/baseline'
  
  # TimeSeriesSplit cross-validation settings
  n_splits: 3

  # LightGBM model parameters
  params:
    objective: 'multiclass'
    metric: 'multi_logloss'
    n_estimators: 1000
    learning_rate: 0.05
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    num_leaves: 31
    verbose: -1
    n_jobs: -1
    boosting_type: 'gbdt'
    # num_class will be determined automatically from the data 